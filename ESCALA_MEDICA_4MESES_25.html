<style>
:root{--bg:#0f1923;--bg2:#16202e;--bg3:#1e2d3d;--bg4:#253447;--card:#1a2636;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--accent:#3b82f6;--accent2:#60a5fa;--text:#e8f0fe;--text2:#8fa8c8;--text3:#4a6080;--mono:'Courier New',monospace;--fer-t:#86efac;--fer-bg:rgba(134,239,172,0.08)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
body.light{--bg:#F5F3EF;--bg2:#EAE7E1;--bg3:#DEDAD3;--bg4:#CEC9C0;--card:#FDFCFA;--border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.13);--accent:#2563EB;--accent2:#1D4ED8;--text:#1A1A1A;--text2:#4A5060;--text3:#8A909E;--fer-t:#15803d;--fer-bg:#dcfce7}
.hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:9px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hdr h1{font-size:.92rem;font-weight:700;color:var(--text)}
.hdr p{font-size:.65rem;color:var(--text2);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:7px}
.tbtn{width:28px;height:28px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.8rem;user-select:none}
.tabs{background:var(--bg2);border-bottom:2px solid var(--accent);padding:0 18px;display:flex;gap:2px;flex-shrink:0;overflow-x:auto}
.tab{padding:7px 14px;cursor:pointer;font-size:.76rem;font-weight:600;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .18s;white-space:nowrap}
.tab:hover{color:var(--text2)}.tab.on{color:var(--accent2);border-bottom-color:var(--accent)}
.main{flex:1;display:flex;min-height:500px}
.left{flex:1;overflow-y:auto;padding:12px 14px;min-width:0;max-height:82vh}
.left::-webkit-scrollbar{width:4px}.left::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}
.rght{width:210px;flex-shrink:0;border-left:1px solid var(--border);overflow-y:auto;padding:10px;max-height:82vh}
.rght::-webkit-scrollbar{width:3px}.rght::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}
.leg{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.lc{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;font-size:.59rem;font-weight:600}
.ld{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.ferias-bar{display:flex;align-items:center;gap:6px;margin-bottom:10px;padding:6px 10px;background:rgba(134,239,172,0.08);border:1px solid rgba(134,239,172,0.2);border-radius:8px;font-size:.68rem;color:var(--fer-t);flex-wrap:wrap}
.ferias-chip{background:rgba(134,239,172,0.15);border-radius:6px;padding:2px 8px;font-weight:700}
.wblock{margin-bottom:16px}
.wtitle{font-size:.68rem;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.stbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border-radius:10px;overflow:hidden;font-size:.68rem}
.stbl th,.stbl td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);text-align:center;padding:0}
.stbl th:last-child,.stbl td:last-child{border-right:none}
.stbl tr:last-child td{border-bottom:none}
.rh th{background:var(--bg2);color:var(--text3);font-size:.6rem;font-weight:700;padding:5px 3px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.rh th.dc{text-align:left;padding-left:8px;color:var(--text2)}
.dayc{background:var(--bg2);font-weight:700;font-size:.66rem;color:var(--text2);padding:5px 6px;text-align:left;min-width:52px;white-space:nowrap;line-height:1.2}

.daydt{display:block;font-size:.58rem;color:var(--text3);font-weight:400;font-family:var(--mono)}
.dayc.sab .dayname{color:var(--text3)}
.dayc.sab{color:var(--text3)}
.fc:hover{filter:brightness(.88)}
.fclbl{font-size:.6rem;font-weight:700;letter-spacing:.1px;line-height:1.2}
.fcname{font-size:.52rem;opacity:.7;margin-top:1px;line-height:1}
.stitle{font-size:.7rem;font-weight:700;color:var(--text);margin-bottom:9px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.pcard{background:var(--bg3);border:1px solid var(--border2);border-radius:7px;padding:7px 9px;margin-bottom:7px}
.pname{font-size:.72rem;font-weight:700;color:var(--text);margin-bottom:5px}
.prow{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.plbl{font-size:.58rem;color:var(--text3)}
.pval{font-size:.62rem;font-weight:700;font-family:var(--mono)}
.an-sec{margin-bottom:13px}
.an-title{font-size:.67rem;font-weight:700;color:var(--text2);margin-bottom:5px}
.rrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.rfunc{font-size:.6rem;color:var(--text2);min-width:65px}
.rbar-w{flex:1;height:4px;background:var(--bg4);border-radius:2px;margin:0 7px}
.rbar{height:100%;border-radius:2px}
.rval{font-size:.6rem;font-weight:700;font-family:var(--mono);min-width:12px;text-align:right}
.has-swap{outline:2px solid rgba(245,158,11,.65);outline-offset:-1px}
.has-realoc{outline:2px solid rgba(239,68,68,.6);outline-offset:-1px}
.sdot{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:#f59e0b}
.ralert{position:absolute;top:1px;left:2px;font-size:.55rem;line-height:1;pointer-events:none}
.fc{padding:5px 2px;cursor:default;transition:filter .1s;min-width:75px;position:relative}
.tt{display:none;position:absolute;z-index:9999;bottom:110%;left:50%;transform:translateX(-50%);background:#1e2d3d;color:#e8f0fe;font-size:.66rem;border:1px solid rgba(255,255,255,.15);border-radius:7px;padding:5px 9px;max-width:200px;box-shadow:0 4px 12px rgba(0,0,0,.4);pointer-events:none;white-space:normal;width:max-content}

.dayc.dom .dayname{color:var(--text3);opacity:.65}

function fs(f){return FC[f]||{bg:"#1f2937",t:"#6b7280",cat:"other",label:f};}

function toggleTheme(){
  isDark=!isDark;document.body.classList.toggle("light",!isDark);
  document.getElementById("tbtn").textContent=isDark?"🌙":"☀️";
}

function show(m){
  cur=m;
  const ALL_TABS=["Junho","Julho","Agosto","Setembro","trocas","realoc","pessoal","visao","analise"];
  document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("on",ALL_TABS[i]===m));
  const isMonth=["Junho","Julho","Agosto","Setembro"].includes(m);
  document.querySelector(".main").style.display=isMonth?"flex":"none";
  document.getElementById("panel-trocas").style.display=m==="trocas"?"flex":"none";
  document.getElementById("panel-realoc").style.display=m==="realoc"?"flex":"none";
  document.getElementById("panel-pessoal").style.display=m==="pessoal"?"flex":"none";
  document.getElementById("panel-visao").style.display=m==="visao"?"flex":"none";
  if(isMonth){renderLeft();renderRight();}
  else if(m==="trocas")renderTrocas();
  else if(m==="realoc")renderRealoc();
  else if(m==="pessoal")renderPessoal();
  else if(m==="visao")renderVisao();
  else if(m==="analise"){document.querySelector(".main").style.display="flex";renderLeft();renderRight();}
}

function getNames(){
  // Always return all 9 doctors in fixed alphabetical order
  return ALL.slice().sort();
}

function getFeriasMes(mes){
  return FP[mes]||[];
}


function ferColor(){return getComputedStyle(document.body).getPropertyValue('--fer-t').trim()||'#86efac';}
function renderLeft(){
  const el=document.getElementById("left");
  if(cur==="analise"){renderAnalysis(el);return;}
  const rows=S[cur]||[];
  const ferInfo=getFeriasMes(cur);
  
  // Legend
  const cats=[
    {label:"Premium L1 (OFF1/COB1)",c:"#93c5fd"},
    {label:"Premium L2 (OFF2/COB2)",c:"#60a5fa"},
    {label:"Financeira (ARIC)",c:"#34d399"},
    {label:"Pesada (CC/HM/MUTIRÃO)",c:"#fdba74"},
    {label:"Leve (ANDY/OTO/UND)",c:"#c4b5fd"},
    {label:"Intermediária (OFF/HM)",c:"#fde047"},
    {label:"Folga",c:"#6b7280"},
    {label:"Férias",c:"#86efac"},
  ];
  let html='<div class="leg">';
  cats.forEach(x=>{html+=`<span class="lc" style="background:rgba(255,255,255,0.05);color:${x.c}"><span class="ld" style="background:${x.c}"></span>${x.label}</span>`;} );
  html+='</div>';
  
  // Férias bar
  html+='<div class="ferias-bar">🌴 Férias:';
  ferInfo.forEach(([doc,wks])=>{
    html+=`<span class="ferias-chip">${doc} — sem. ${wks.join(",")}</span>`;
  });
  html+='</div>';
  
  // Weeks
  [1,2,3,4].forEach(wk=>{
    const wkRows=rows.filter(r=>r.week===wk);
    const names=getNames();
    const ferDoc=wkRows[0]?.ferias||"";
    html+=`<div class="wblock"><div class="wtitle">Semana ${wk}${ferDoc?` · <span style="color:#86efac;font-weight:700">🌴 ${ferDoc} em férias</span>`:""}`;
    html=html.replace(`Semana ${wk}${ferDoc?` · <span style="color:#86efac;font-weight:700">🌴 ${ferDoc} em férias</span>`:""}`,"");
    // rebuild
    html+=`<div class="wblock"><div class="wtitle">Semana ${wk}`;
    if(ferDoc) html+=` &nbsp;<span style="color:#86efac;font-size:.62rem;font-weight:600">🌴 ${ferDoc} em férias</span>`;
    html+='</div>';
    html+='<table class="stbl"><tr class="rh"><th class="dc">Dia</th>';
    names.forEach(n=>{const isFer=n===(wkRows[0]?.ferias||"");html+=`<th style="min-width:70px;max-width:90px;${isFer?"opacity:.6;color:#86efac":""}">${n==="VICTORIA A"?"VIC.A":n==="VICTORIA V"?"VIC.V":shortName(n)}${isFer?" 🌴":""}</th>`;});
    html+='</tr>';
    wkRows.forEach(row=>{
      const isSab=row.day==="Sáb";
      const isDom=row.day==="Dom";
      const dt=(DT[cur]&&DT[cur][String(wk)]&&DT[cur][String(wk)][row.day])||"";
      html+='<tr style="'+(isDom?'opacity:.7':'')+'"><td class="dayc'+(isSab?' sab':isDom?' dom':'')+'"><span class="dayname">'+row.day+'</span><span class="daydt">'+dt+'</span></td>';
      names.forEach(name=>{
        const isFerDoc=name===row.ferias;
        const f=isFerDoc?"FÉRIAS":(row[name]||"");
        const s=isFerDoc?{bg:"var(--fer-bg)",t:ferColor()}:fs(f);
        const lbl=isFerDoc?"🌴 FÉRIAS":(s.label||f);
        const swp=!isFerDoc&&isSwap(cur,wk,row.day,name);
        const rlc=!isFerDoc&&isRealoc(cur,wk,row.day,name);
        const rtxt=rlc?getRealoc(cur,wk,row.day,name):'';
        html+='<td class="fc'+(swp?' has-swap':'')+(rlc?' has-realoc':'')+'" style="background:'+s.bg+';color:'+s.t+';'+(isFerDoc?'opacity:.65;font-style:italic':'')+'">'
          +(swp?'<span class="sdot"></span>':'')+(rlc?'<span class="ralert">⚠️</span>':'')
          +'<div class="fclbl">'+lbl+(swp?' ⇄':'')+'</div>'+(rlc?'<span class="tt">'+rtxt+'</span>':'')
          +'</td>';
      });
      html+='</tr>';
    });
    html+='</table></div>';
  });
  
  // Fix double wblock issue from JS string manipulation
  el.innerHTML=html;
}

function renderRight(){
  const el=document.getElementById("rght");
  if(cur==="analise"){el.innerHTML="";return;}
  const rows=S[cur]||[];
  
  // Count per doctor for this month
  const counts={};
  ALL.forEach(m=>{counts[m]={};} );
  rows.forEach(row=>{
    ALL.forEach(m=>{
      const f=row[m];
      if(f) counts[m][f]=(counts[m][f]||0)+1;
    });
  });
  
  const ferInfo=getFeriasMes(cur);
  const ferDocs=ferInfo.map(x=>x[0]);
  
  let html=`<div class="stitle">📊 ${cur}</div>`;
  ALL.forEach(m=>{
    const c=counts[m];
    const isFer=ferDocs.includes(m);
    const prem1=(c["OFF1"]||0)+(c["COB1"]||0);
    const prem2=(c["OFF2"]||0)+(c["COB2"]||0);
    const fin=(c["ARIC $"]||0)+(c["ARIC 1/2$"]||0)+(c["ARIC/OFF"]||0);
    const heavy=(c["HM/HM/CIND"]||0)+(c["HM/PO"]||0)+(c["OFF/HM/CIND"]||0);
    const oto=c["OTONEURO"]||0;
    const sab=(c["MUTIRÃO"]||0)+(c["UND. EXT."]||0);
    html+=`<div class="pcard"${isFer?` style="opacity:.6;border-color:rgba(134,239,172,0.3)"`:""}>
      <div class="pname">${m}${isFer?` <span style="font-size:.55rem;color:#86efac">🌴 férias</span>`:""}</div>
      ${isFer?`<div style="font-size:.62rem;color:#86efac">Em férias neste mês</div>`:`
      <div class="prow"><span class="plbl">Prem L1</span><span class="pval" style="color:#4ade80">${prem1}×</span></div>
      <div class="prow"><span class="plbl">Prem L2</span><span class="pval" style="color:#60a5fa">${prem2}×</span></div>
      <div class="prow"><span class="plbl">Financeira</span><span class="pval" style="color:#34d399">${fin}×</span></div>
      <div class="prow"><span class="plbl">Pesada</span><span class="pval" style="color:#fca5a5">${heavy}×</span></div>
      <div class="prow"><span class="plbl">OTONEURO</span><span class="pval" style="color:#c4b5fd">${oto}×</span></div>
      <div class="prow"><span class="plbl">Sáb</span><span class="pval" style="color:#fda4af">${sab}×</span></div>`}
    </div>`;
  });
  el.innerHTML=html;
}

function renderAnalysis(el){
  const gc={};ALL.forEach(m=>{gc[m]={};} );
  ["Junho","Julho","Agosto","Setembro"].forEach(m=>{
    (S[m]||[]).forEach(row=>{
      ALL.forEach(p=>{const f=row[p];if(f)gc[p][f]=(gc[p][f]||0)+1;});
    });
  });
  
  const KF=["OFF1","COB1","OFF2","COB2","ARIC $","ARIC 1/2$","OTONEURO","HM/HM/CIND","HM/PO","OFF/HM/CIND","MUTIRÃO","UND. EXT.","ANDY","ANDY/CC","CC1","CC2","CC3","CC4","CC5"];
  
  let html=`<div style="margin-bottom:14px">
    <div style="font-size:.82rem;font-weight:700;color:var(--text);margin-bottom:3px">📊 Análise — Jun a Set 2026</div>
    <div style="font-size:.66rem;color:var(--text2)">Distribuição acumulada · 4 meses · 9 médicos</div>
  </div>`;
  
  html+=`<div class="an-sec"><div class="an-title">Range por Função (4 meses)</div>`;
  KF.forEach(f=>{
    const s=fs(f);
    const vals=ALL.map(p=>gc[p][f]||0);
    const rng=Math.max(...vals)-Math.min(...vals);
    const mx=Math.max(...vals);
    const pct=mx>0?(rng/mx)*100:0;
    const col=rng===0?"#4ade80":rng<=2?"#fbbf24":rng<=3?"#fb923c":"#f87171";
    html+=`<div class="rrow">
      <span class="rfunc" style="color:${s.t||"#8fa8c8"}">${s.label||f}</span>

function onDI(el){
  let v=el.value.replace(/[^0-9/]/g,'');
  if(v.length===2&&!v.includes('/'))v+='/';
  el.value=v;
  const h=document.getElementById('tr-hint');
  if(h){if(v.length===5){const i=DL[v];if(i){h.style.color='#4ade80';h.textContent=i.dia+', Sem '+i.wk+' '+i.mes;}else{h.style.color='#f87171';h.textContent='Data nao encontrada';}}else h.textContent='';}
  updateTrFuncs();
}
function updateTrFuncs(){
  const dv=document.getElementById('tr-date')?.value;
  const m1=document.getElementById('tr-m1')?.value;
  const m2=document.getElementById('tr-m2')?.value;
  if(!dv||dv.length<5||!m1||!m2)return;
  const info=DL[dv];if(!info)return;
  const row=(S[info.mes]||[]).filter(r=>r.week===info.wk&&r.day===info.dia)[0]||{};
  const f1=document.getElementById('tr-f1');
  const f2=document.getElementById('tr-f2');
  if(f1)f1.innerHTML='<option>'+(row[m1]||'—')+'</option>';
  if(f2)f2.innerHTML='<option>'+(row[m2]||'—')+'</option>';
}

function submitTroca(){
  const dv=document.getElementById('tr-date').value;
  const m1=document.getElementById('tr-m1').value;
  const m2=document.getElementById('tr-m2').value;
  const obs=document.getElementById('tr-obs').value.trim();
  const msg=document.getElementById('tr-msg');
  if(m1===m2){if(msg){msg.style.color='#f87171';msg.textContent='Selecione medicos diferentes';}return;}
  if(!dv||dv.length<5){if(msg){msg.style.color='#f87171';msg.textContent='Informe a data DD/MM';}return;}
  const info=DL[dv];
  if(!info){if(msg){msg.style.color='#f87171';msg.textContent='Data nao encontrada';}return;}
  const {mes,wk,dia}=info;
  const row=(S[mes]||[]).find(r=>r.week===wk&&r.day===dia);
  if(!row)return;
  const f1o=row[m1]||'',f2o=row[m2]||'';
  if(!f1o||!f2o||f1o.includes('RIAS')||f2o.includes('RIAS')){if(msg){msg.style.color='#f87171';msg.textContent='Nao pode trocar com medico de ferias';}return;}
  row[m1]=f2o;row[m2]=f1o;
  setSwap(mes,wk,dia,m1,true);setSwap(mes,wk,dia,m2,true);
  trocas.unshift({id:Date.now(),date:dv,mes,wk,dia,m1,f1o,f1n:f2o,m2,f2o,f2n:f1o,obs,active:true});
  if(msg){msg.style.color='#4ade80';msg.textContent='Confirmado: '+m1+' com '+m2+' em '+dv;}
  if(['Junho','Julho','Agosto','Setembro'].includes(cur)&&cur===mes){renderLeft();renderRight();}
  setTimeout(()=>renderTrocas(),50);
}
function undoTroca(id){
  const t=trocas.find(x=>x.id===id);if(!t||!t.active)return;
  const rows=(S[t.mes]||[]).filter(r=>r.week===t.wk&&r.day===t.dia);
  const row=rows[0];if(row){row[t.m1]=t.f1o;row[t.m2]=t.f2o;}
  setSwap(t.mes,t.wk,t.dia,t.m1,false);setSwap(t.mes,t.wk,t.dia,t.m2,false);
  t.active=false;
  if(['Junho','Julho','Agosto','Setembro'].includes(cur)&&cur===t.mes){renderLeft();renderRight();}
  renderTrocas();
}

function resetTrocas(){
  trocas.filter(t=>t.active).forEach(t=>{
    const row=(S[t.mes]||[]).find(r=>r.week===t.wk&&r.day===t.dia);
    if(row){row[t.m1]=t.f1o;row[t.m2]=t.f2o;}
    setSwap(t.mes,t.wk,t.dia,t.m1,false);setSwap(t.mes,t.wk,t.dia,t.m2,false);
  });
  trocas=[];
  ['Junho','Julho','Agosto','Setembro'].forEach(m=>{if(cur===m){renderLeft();renderRight();}});
  renderTrocas();
}

        const s=isFer?{bg:"rgba(134,239,172,0.1)",t:"#86efac"}:fs(f);
        const dt=(DT[mes]&&DT[mes][String(wk)]&&DT[mes][String(wk)][row.day])||"";
        const pswp=!isFer&&isSwap(mes,wk,row.day,selectedDoc);
        const prlc=!isFer&&isRealoc(mes,wk,row.day,selectedDoc);
        const prtxt=prlc?getRealoc(mes,wk,row.day,selectedDoc):'';
        calHtml+='<div style="display:flex;align-items:center;justify-content:space-between;padding:3px 5px;border-radius:5px;margin-bottom:2px;background:'+s.bg+';'
          +(pswp?'outline:1px solid rgba(245,158,11,.7);':'')+(prlc?'outline:1px solid rgba(239,68,68,.6);':'')
          +'" title="'+(prlc?prtxt.replace(/"/g,'&quot;'):'')+'">'
          +'<span style="font-size:.6rem;color:'+s.t+';font-weight:600">'+row.day
          +'<span style="font-size:.54rem;opacity:.65;margin-left:3px">'+dt+'</span></span>'
          +'<span style="font-size:.6rem;font-weight:700;color:'+s.t+';font-family:var(--mono)">'+(fs(f).label||f||'—')+(pswp?' ⇄':'')+(prlc?' ⚠️':'')+'</span></div>';
      });
      calHtml+='</div>';
    });
    calHtml+='</div></div>';
  });
  calHtml+='</div>';

  el.innerHTML=chips+stats+calHtml;
}

// ── VISÃO GERAL ───────────────────────────────────────────────────────────
function renderVisao(){
  const el=document.getElementById("panel-visao");
  const MONTHS=["Junho","Julho","Agosto","Setembro"];

  const gc={};ALL.forEach(m=>{gc[m]={};});
  MONTHS.forEach(mes=>{
    const ferInfo=getFeriasMes(mes);
    (S[mes]||[]).forEach(row=>{
      const ferDoc=row.ferias||"";
      ALL.forEach(m=>{
        const f=(m===ferDoc)?"FÉRIAS":(row[m]||"");
        if(f)gc[m][f]=(gc[m][f]||0)+1;
      });
    });
  });

  const TOTAL_DAYS=112;
  const presencaFn=m=>(gc[m]["OFF1"]||0)+(gc[m]["COB1"]||0)+(gc[m]["OFF2"]||0)+(gc[m]["COB2"]||0)+(gc[m]["ARIC $"]||0)+(gc[m]["ARIC 1/2$"]||0)+(gc[m]["ARIC/OFF"]||0)+(gc[m]["HM/HM/CIND"]||0)+(gc[m]["HM/PO"]||0)+(gc[m]["CC1"]||0)+(gc[m]["CC2"]||0)+(gc[m]["CC3"]||0)+(gc[m]["CC4"]||0)+(gc[m]["CC5"]||0)+(gc[m]["ANDY/CC"]||0)+(gc[m]["MUTIRÃO"]||0)+(gc[m]["ANDY"]||0)+(gc[m]["OTONEURO"]||0)+(gc[m]["UND. EXT."]||0)+(gc[m]["OFF/HM/CIND"]||0);
  const CAT_COLS=[
    {label:"Prem L1",col:"#93c5fd",fn:m=>(gc[m]["OFF1"]||0)+(gc[m]["COB1"]||0)},
    {label:"Prem L2",col:"#60a5fa",fn:m=>(gc[m]["OFF2"]||0)+(gc[m]["COB2"]||0)},
    {label:"Financ.",col:"#34d399",fn:m=>(gc[m]["ARIC $"]||0)+(gc[m]["ARIC 1/2$"]||0)+(gc[m]["ARIC/OFF"]||0)},
    {label:"Pesada",col:"#fdba74",fn:m=>(gc[m]["HM/HM/CIND"]||0)+(gc[m]["HM/PO"]||0)+(gc[m]["CC1"]||0)+(gc[m]["CC2"]||0)+(gc[m]["CC3"]||0)+(gc[m]["CC4"]||0)+(gc[m]["CC5"]||0)+(gc[m]["ANDY/CC"]||0)+(gc[m]["MUTIRÃO"]||0)},
    {label:"Leve",col:"#c4b5fd",fn:m=>(gc[m]["ANDY"]||0)+(gc[m]["OTONEURO"]||0)+(gc[m]["UND. EXT."]||0)},
    {label:"Interm.",col:"#fde047",fn:m=>(gc[m]["OFF/HM/CIND"]||0)},
    {label:"Folga",col:"#6b7280",fn:m=>gc[m]["FOLGA"]||0},
    {label:"Férias",col:"#86efac",fn:m=>gc[m]["FÉRIAS"]||0},
    {label:"% Presença",col:"#a78bfa",fn:m=>Math.round(presencaFn(m)/TOTAL_DAYS*100)},
  ];

  // ── TOTALS TABLE FIRST — full width, no overflow ──────────────────────
  let tblHtml=`<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;flex-shrink:0">
    <div style="font-size:.85rem;font-weight:700;color:var(--text);margin-bottom:14px">📊 Totais por Médico — 4 Meses (Jun–Set 2026)</div>
    <table style="width:100%;border-collapse:collapse;font-size:.76rem">
      <thead>
        <tr>
          <th style="text-align:left;padding:7px 10px;color:var(--text3);border-bottom:2px solid var(--border2);font-size:.65rem;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap">Médico</th>
          ${CAT_COLS.map(({label,col})=>`<th style="padding:7px 8px;color:${col};border-bottom:2px solid var(--border2);font-size:.65rem;text-transform:uppercase;letter-spacing:.4px;text-align:center;white-space:nowrap">${label}</th>`).join("")}
        </tr>
      </thead>
      <tbody>
        ${ALL.map((m,ri)=>`<tr style="background:${ri%2===0?"var(--bg3)20":"transparent"}">
          <td style="padding:8px 10px;font-weight:700;color:var(--text);border-bottom:1px solid var(--border);white-space:nowrap">${m}</td>
          ${CAT_COLS.map(({fn,col,label})=>{const v=fn(m);const disp=label==='% Presença'?(v>0?v+'%':'—'):(v>0?v:'—');return `<td style="padding:8px 8px;text-align:center;font-weight:700;color:${v>0?col:"var(--text3)"};border-bottom:1px solid var(--border);font-family:var(--mono)">${disp}</td>`;}).join("")}
        </tr>`).join("")}
        <tr style="border-top:2px solid var(--border2)">
          <td style="padding:6px 10px;font-size:.62rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px">Range</td>
          ${CAT_COLS.map(({fn,label})=>{const vals=ALL.map(m=>fn(m));const rng=Math.max(...vals)-Math.min(...vals);const col=rng===0?"#4ade80":rng<=2?"#fbbf24":rng<=4?"#fb923c":"#f87171";const dispR=label==='% Presença'?rng+'pp':rng;return `<td style="padding:6px 8px;text-align:center;font-weight:700;color:${col};font-family:var(--mono);font-size:.72rem">${dispR}</td>`;}).join("")}
        </tr>
      </tbody>
    </table>
  </div>`;

  // ── RANGE BAR CHART SECOND ──────────────────────────────────────────────
  const KEY_FUNCS=[
    {f:"OFF1",col:"#93c5fd"},{f:"COB1",col:"#bfdbfe"},
    {f:"OFF2",col:"#60a5fa"},{f:"COB2",col:"#93c5fd"},
    {f:"ARIC $",col:"#34d399"},{f:"ARIC 1/2$",col:"#6ee7b7"},
    {f:"OTONEURO",col:"#c4b5fd"},
    {f:"HM/HM/CIND",col:"#fca5a5"},{f:"HM/PO",col:"#fb923c"},{f:"OFF/HM/CIND",col:"#fdba74"},
    {f:"MUTIRÃO",col:"#fb923c"},{f:"UND. EXT.",col:"#e9d5ff"},
    {f:"ANDY",col:"#c4b5fd"},{f:"ANDY/CC",col:"#fbbf24"},
    {f:"CC1",col:"#fdba74"},{f:"CC3",col:"#fdba74"},{f:"CC5",col:"#fdba74"},
  ];

  let rangeHtml=`<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;flex-shrink:0">
    <div style="font-size:.82rem;font-weight:700;color:var(--text);margin-bottom:12px">📈 Range por Função — 4 meses <span style="font-size:.65rem;color:var(--text3);font-weight:400;margin-left:6px">0 = equilíbrio perfeito</span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 24px">`;

  KEY_FUNCS.forEach(({f,col})=>{
    const s=fs(f);
    const vals=ALL.map(m=>gc[m][f]||0);
    const rng=Math.max(...vals)-Math.min(...vals);
    const mx=Math.max(...vals)||1;
    const pct=(rng/mx)*100;
    const clr=rng===0?"#4ade80":rng<=2?"#fbbf24":rng<=3?"#fb923c":"#f87171";
    rangeHtml+=`<div style="display:flex;align-items:center;gap:8px;padding:3px 0">
      <span style="font-size:.64rem;color:${s.t||col};min-width:80px;white-space:nowrap">${s.label||f}</span>
      <div style="flex:1;height:6px;background:var(--bg4);border-radius:3px">
        <div style="height:100%;width:${Math.max(pct,4)}%;background:${clr};border-radius:3px"></div>
      </div>
      <span style="font-size:.64rem;font-weight:700;color:${clr};min-width:16px;text-align:right;font-family:var(--mono)">${rng}</span>
    </div>`;
  });
  rangeHtml+=`</div></div>`;

  // ── NOTE ────────────────────────────────────────────────────────────────
  const noteHtml=`<div style="background:var(--bg3);border-radius:10px;padding:12px 14px;font-size:.65rem;color:var(--text2);line-height:1.7;flex-shrink:0">
    <div style="font-weight:700;color:var(--text);margin-bottom:4px">⚖️ Critérios de Otimização</div>
    OTONEURO · ARIC$ · ARIC½$ · MUTIRÃO · UND.EXT → Range = 0 ✅<br>
    OFF1/COB1 e OFF2/COB2 compensam-se mutuamente entre meses<br>
    Shifts [0,3,5,6] ↔ [1,2,4,7] garantem equilíbrio trimestral · Desvio padrão mínimo
  </div>`;

  el.innerHTML=tblHtml+rangeHtml+noteHtml;
}


function renderRealoc(){
  var el=document.getElementById('panel-realoc');
  if(!el)return;
  el.innerHTML='';
  var dO='';
  ALL.forEach(function(m){dO+='<option value="'+m+'">'+m+'</option>';});
  var card=document.createElement('div');
  card.className='pcard';card.style.padding='14px';card.style.marginBottom='12px';
  card.innerHTML='<div class="pname" style="margin-bottom:10px">Marcar Realocacao</div>'
    +'<div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap">'
    +'<div style="flex:1;min-width:130px"><div class="plbl" style="margin-bottom:3px">Medico</div>'
    +'<select id="rl-doc" style="width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:7px;padding:6px 8px;color:var(--text);font-size:.76rem;font-family:inherit">'+dO+'</select></div>'
    +'<div style="flex:.8;min-width:110px"><div class="plbl" style="margin-bottom:3px">Data (DD/MM)</div>'
    +'<input type="text" id="rl-date" placeholder="15/06" maxlength="5" style="width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:7px;padding:6px 9px;color:var(--text);font-size:.82rem;font-family:inherit;letter-spacing:1px">'
    +'<div id="rl-hint" style="font-size:.6rem;color:var(--text3);margin-top:2px;min-height:13px"></div></div>'
    +'<div style="flex:1;min-width:120px"><div class="plbl" style="margin-bottom:3px">Funcao no dia</div>'
    +'<div id="rl-func" style="background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:6px 9px;font-size:.76rem;color:var(--text3)">-</div></div>'
    +'<div style="flex:2;min-width:180px"><div class="plbl" style="margin-bottom:3px">Observacao</div>'
    +'<input type="text" id="rl-obs" placeholder="Ex: Cobrindo cirurgia urgente..." style="width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:7px;padding:6px 9px;color:var(--text);font-size:.76rem;font-family:inherit"></div>'
    +'<div style="padding-top:18px"><button id="rl-btn" style="background:var(--accent);color:#fff;border:none;border-radius:7px;padding:7px 14px;font-weight:700;font-size:.78rem;cursor:pointer;font-family:inherit">Marcar</button></div>'
    +'</div><div id="rl-msg" style="font-size:.68rem;color:#4ade80;margin-top:8px;min-height:14px"></div>';
  el.appendChild(card);
  var allR=[];
  ['Junho','Julho','Agosto','Setembro'].forEach(function(mes){
    if(!realocs[mes])return;
    Object.keys(realocs[mes]).forEach(function(wk){
      Object.keys(realocs[mes][wk]).forEach(function(dia){
        Object.keys(realocs[mes][wk][dia]).forEach(function(m){
          var obs=realocs[mes][wk][dia][m];
          var dt=(DT[mes]&&DT[mes][wk]&&DT[mes][wk][dia])||'';
          var row=(S[mes]||[]).find(function(r){return r.week===parseInt(wk)&&r.day===dia;});
          var f=row?row[m]:'';var s=fs(f);
          allR.push({mes:mes,wk:parseInt(wk),dia:dia,m:m,obs:obs,dt:dt,f:f,s:s});
        });
      });
    });
  });
  var listDiv=document.createElement('div');
  var lh='<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)">'
    +'<div style="font-size:.8rem;font-weight:700;color:var(--text)">Realocacoes ('+allR.length+')</div>'
    +(allR.length>0?'<button onclick="resetRealocs()" style="background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#f87171;border-radius:5px;padding:2px 9px;font-size:.66rem;font-weight:700;cursor:pointer;font-family:inherit">Resetar</button>':'')
    +'</div>';
  if(allR.length===0){
    lh+='<div style="padding:28px;text-align:center;color:var(--text3);font-size:.78rem">Nenhuma realocacao registrada.</div>';
  }else{
    lh+='<table style="width:100%;border-collapse:collapse;font-size:.7rem"><thead><tr>'
      +['Medico','Data','Dia','Funcao','Observacao','Acao'].map(function(h){return '<th style="background:var(--bg2);color:var(--text3);font-size:.6rem;padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)">'+h+'</th>';}).join('')
      +'</tr></thead><tbody>';
    allR.forEach(function(r,ri){
      lh+='<tr>'
        +'<td style="padding:6px 10px;border-bottom:1px solid var(--border);font-weight:700;color:var(--text)">'+r.m+'</td>'
        +'<td style="padding:6px 10px;border-bottom:1px solid var(--border);font-family:var(--mono);font-weight:600;color:var(--text2)">'+r.dt+'</td>'
        +'<td style="padding:6px 10px;border-bottom:1px solid var(--border);color:var(--text3)">'+r.dia+'</td>'
        +'<td style="padding:6px 10px;border-bottom:1px solid var(--border)"><span style="background:'+r.s.bg+';color:'+r.s.t+';border-radius:4px;padding:2px 7px;font-size:.64rem;font-weight:700">'+(r.s.label||r.f)+'</span></td>'
        +'<td style="padding:6px 10px;border-bottom:1px solid var(--border);color:var(--text2)">'+r.obs+'</td>'
        +'<td style="padding:6px 10px;border-bottom:1px solid var(--border)"><button data-ri="'+ri+'" onclick="rlDel(+this.dataset.ri)" style="background:none;border:1px solid var(--border2);border-radius:4px;padding:2px 7px;font-size:.6rem;color:var(--text3);cursor:pointer;font-family:inherit">Remover</button></td>'
        +'</tr>';
    });
    lh+='</tbody></table>';
  }
  lh+='</div>';
  listDiv.innerHTML=lh;
  el.appendChild(listDiv);
  window._rlAllR=allR;
  var ds=document.getElementById('rl-doc');var de=document.getElementById('rl-date');var bn=document.getElementById('rl-btn');
  if(ds)ds.onchange=onRlChange;if(de)de.oninput=function(){onRlDI(this);};if(bn)bn.onclick=submitRealoc;
}
function rlDel(i){var r=window._rlAllR[i];if(r)removeRealoc(r.mes,r.wk,r.dia,r.m);}
function onRlDI(el){
  var v=el.value.replace(/[^0-9/]/g,'');if(v.length===2&&v.indexOf('/')<0)v+='/';el.value=v;
  var h=document.getElementById('rl-hint');
  if(h){if(v.length===5){var i=DL[v];if(i){h.style.color='#4ade80';h.textContent=i.dia+', Sem '+i.wk+' '+i.mes;}else{h.style.color='#f87171';h.textContent='Nao encontrada';}}else h.textContent='';}
  onRlChange();
}
function onRlChange(){
  var doc=document.getElementById('rl-doc')?document.getElementById('rl-doc').value:'';
  var dv=document.getElementById('rl-date')?document.getElementById('rl-date').value:'';
  var fe=document.getElementById('rl-func');if(!fe)return;
  if(!dv||dv.length<5){fe.innerHTML='-';return;}
  var info=DL[dv];if(!info){fe.innerHTML='<span style="color:#f87171">Data invalida</span>';return;}
  var row=(S[info.mes]||[]).find(function(r){return r.week===info.wk&&r.day===info.dia;});
  if(!row){fe.innerHTML='-';return;}
  var f=row[doc]||'';if(!f){fe.innerHTML='<span style="color:#6b7280">De ferias</span>';return;}
  var s=fs(f);fe.innerHTML='<span style="background:'+s.bg+';color:'+s.t+';border-radius:5px;padding:3px 8px;font-size:.76rem;font-weight:700">'+(s.label||f)+'</span>';
}
function submitRealoc(){
  var doc=document.getElementById('rl-doc').value;var dv=document.getElementById('rl-date').value;
  var obs=document.getElementById('rl-obs').value.trim();var msg=document.getElementById('rl-msg');
  if(!dv||dv.length<5){if(msg){msg.style.color='#f87171';msg.textContent='Informe a data';}return;}
  var info=DL[dv];if(!info){if(msg){msg.style.color='#f87171';msg.textContent='Data nao encontrada';}return;}
  if(!obs){if(msg){msg.style.color='#f87171';msg.textContent='Informe a observacao';}return;}
  setRealoc(info.mes,info.wk,info.dia,doc,obs);
  if(msg){msg.style.color='#4ade80';msg.textContent='Registrado: '+doc+' em '+dv;}
  if(['Junho','Julho','Agosto','Setembro'].indexOf(cur)>=0&&cur===info.mes){renderLeft();renderRight();}
  renderRealoc();
}
function removeRealoc(mes,wk,dia,m){
  setRealoc(mes,wk,dia,m,null);
  if(['Junho','Julho','Agosto','Setembro'].indexOf(cur)>=0&&cur===mes){renderLeft();renderRight();}
  renderRealoc();
}
function resetRealocs(){
  ['Junho','Julho','Agosto','Setembro'].forEach(function(m){delete realocs[m];});
  if(['Junho','Julho','Agosto','Setembro'].indexOf(cur)>=0){renderLeft();renderRight();}
  renderRealoc();
}
document.addEventListener("DOMContentLoaded",()=>{renderLeft();renderRight();});
</script>
</body>
</html>
